<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>typ-js example</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #121212;
        color: #ccc;
        font-family: monospace;
        font-size: 16px;
      }
      body {
        padding: 1em;
      }
      textarea, input, button {
        box-sizing: border-box;
        display: block;
        padding: 0.6em;
        margin-bottom: 0.6em;
        font-family: inherit;
        font-size: inherit;
        border-radius: 1em;
        background: #2e2d39;
        color: inherit;
        border: 3px solid black;
        &:focus {
          border-color: #a8a5ff;
          outline: none;
        }
      }
      textarea {
        width: 100%;
        height: 50vh;
      }
      svg {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <textarea id="input" placeholder="Type here">#set page(fill: rgb("#2e2d39"))
#set text(fill: rgb("#ccc"), font: "JetBrains Mono")
#import "@preview/yap:0.1.0"

Works</textarea>
    <input id="file" type="file"></input>
    
    <div id="output">
      Loading...
    </div>
    <button id="download">Download as PDF</button>

    <script>
      // For playing around in the REPL
      let pack;
      import("/pkg/typ_js.js").then(pkg => {
        pack = pkg
        return pkg.default()
      }).then(main)

      const input = document.getElementById("input")
      const file = document.getElementById("file")
      const download = document.getElementById("download")
      const output = document.getElementById("output")

      let typ
      async function compile() {
        await typ.deps("main.typ")
        const { svg, err } = await typ.svg("main.typ")
        if (svg && err.length) console.warn(...err)
        output.innerHTML = svg || `<pre>${JSON.stringify(err, null, 4)}</pre>`
      }
      async function main() {
        typ = pack.TypJs.new()

        input.oninput = async () => {
          typ.add("main.typ", new TextEncoder().encode(input.value))
          compile()
        }

        typ.font(new Uint8Array(await (await fetch("/jetbrains mono.ttf")).arrayBuffer()))
        typ.add("main.typ", new TextEncoder().encode(input.value))
        await typ.deps("main.typ")
        input.oninput()

        file.addEventListener("change", async () => {
          const f = file.files[0]
          if (!f) return
          const buf = await f.arrayBuffer()
          typ.add(f.name, new Uint8Array(buf))
          compile()
        })

        download.addEventListener("click", () => {
          const file = new File([typ.pdf()], "typ-js-output.pdf")
          const link = document.createElement("a")
          link.href = URL.createObjectURL(file)
          link.download = "typ-js-output.pdf"
          link.click()
          link.remove()
        })
      }
    </script>
  </body>
</html>
