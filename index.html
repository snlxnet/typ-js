<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>typ-js example</title>
    <style>
      html, body {
        background: #121212;
        color: #ccc;
        font-family: monospace;
        font-size: 16px;
      }
      textarea, input, button {
        display: block;
        padding: 0.6em;
        font-family: inherit;
        font-size: inherit;
        border-radius: 1em;
        background: #2e2d39;
        color: inherit;
        border: 3px solid black;
        &:focus {
          outline: 3px solid #a8a5ff;
        }
      }
      textarea {
        width: 100%;
        height: 50vh;
      }
    </style>
  </head>
  <body>
    <textarea id="input" placeholder="Type here">#set page(fill: rgb("#2e2d39"))
#set text(fill: rgb("#ccc"))
#import "@preview/yap:0.1.0"

Works</textarea>
    <input id="file" type="file"></input>
    
    <pre id="tree">
    </pre>
    <pre id="errors">
    </pre>
    <div id="output">
      Loading...
    </div>
    <button id="download">Download as PDF</button>

    <script>
      // For playing around in the REPL
      let pack;
      import("/pkg/typ_js.js").then(pkg => {
        pack = pkg
        return pkg.default()
      }).then(main)

      const input = document.getElementById("input")
      const file = document.getElementById("file")
      const download = document.getElementById("download")
      const tree = document.getElementById("tree")
      const errors = document.getElementById("errors")
      const output = document.getElementById("output")

      let typ
      function main() {
        typ = pack.TypJs.new()
        tree.innerHTML = typ.list()

        input.oninput = async () => {
          typ.write("main.typ", input.value)
          output.innerHTML = await typ.svg()
          errors.innerHTML = JSON.stringify(typ.errors(), null, 4)
        }

        typ.write("main.typ", input.value)
        typ.deps().then(() => input.oninput())

        file.addEventListener("change", async () => {
          const f = file.files[0]
          if (!f) return
          const data = await f.arrayBuffer()
          const array = new Uint8Array(data)

          output.innerHTML = await typ.svg()
        })

        download.addEventListener("click", () => {
          const file = new File([typ.pdf()], "typ-js-output.pdf")
          const link = document.createElement("a")
          link.href = URL.createObjectURL(file)
          link.download = "typ-js-output.pdf"
          link.click()
          link.remove()
        })
      }
    </script>
  </body>
</html>
