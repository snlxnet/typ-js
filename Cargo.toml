[package]
name = "typ-js"
description = "A simple JS wrapper for the Typst compiler"
repository = "https://github.com/snlxnet/typ-js"
license = "Apache-2.0"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["crates/*"]
resolver = "3"

[dependencies]
typst = { git = "https://github.com/typst/typst.git" }
typst-layout = { git = "https://github.com/typst/typst.git" }
typst-kit = { git = "https://github.com/typst/typst.git", features = ["embedded-fonts", "bundle", "datetime", "universe-packages"] }
typst-pdf = { git = "https://github.com/typst/typst.git" }
typst-svg-mod = { path = "crates/svg" }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"]  }
reqwest = "0.13.5"
console_log = "1.1.0"
log = "0.4.34"
wasm-bindgen-futures = "0.4.79"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
codespan-reporting = "0.13.1"
serde_bytes = "0.11.19"
serde-wasm-bindgen = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
opt-level = "z"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = true
dwarf-debug-info = false
omit-default-module-path = false
